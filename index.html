<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uke Tuner</title>
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-title" content="Uke Tuner">
<meta name="theme-color" content="#f4dfcd">
<style>
  :root {
    --bg: #f8f3ea;
    --card: #f4dfcd;
    --card-edge: #e6c9b0;
    --box: #fbf7f0;
    --ink: #5b4a40;
    --ink-soft: #9a8678;
    --sage: #b9cbaa;
    --sage-edge: #98b086;
    --needle: #8a7466;
    --target: #5b4a40;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
    display: flex;
    justify-content: center;
    padding: 28px 16px 40px;
  }
  main { width: 100%; max-width: 520px; }
  .logo {
    display: block;
    margin: 0 auto 10px;
    border-radius: 20px;
  }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 400;
    letter-spacing: 0.04em;
    text-align: center;
    margin: 0 0 6px;
    font-size: 2rem;
  }
  .status {
    text-align: center;
    color: var(--ink-soft);
    font-size: 0.9rem;
    min-height: 1.3em;
    margin-bottom: 18px;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .card {
    background: var(--card);
    border: 2px solid var(--card-edge);
    border-radius: 20px;
    padding: 16px 12px 14px;
    text-align: center;
    transition: background-color 0.45s ease, border-color 0.45s ease, opacity 0.4s ease, transform 0.4s ease;
    opacity: 0.8;
  }
  .card.active { opacity: 1; }
  .card.intune {
    background: var(--sage);
    border-color: var(--sage-edge);
    transform: scale(1.02);
    opacity: 1;
  }
  .note {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 2.2rem;
    margin-bottom: 10px;
  }
  .note small { font-size: 1rem; color: var(--ink-soft); margin-left: 2px; }
  .boxes { display: flex; gap: 12px; justify-content: center; }
  .col { flex: 1; min-width: 0; }
  .label {
    font-size: 0.68rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 5px;
  }
  .box {
    position: relative;
    height: 96px;
    background: var(--box);
    border: 2px solid var(--card-edge);
    border-radius: 10px;
    overflow: hidden;
    transition: border-color 0.45s ease;
  }
  .card.intune .box { border-color: var(--sage-edge); }
  .mid {
    position: absolute; left: 0; right: 0; top: 50%;
    border-top: 1px dashed rgba(91,74,64,0.15);
  }
  .line {
    position: absolute; left: 10%; width: 80%; height: 4px;
    top: 0; margin-top: -2px;
    border-radius: 3px;
    background: var(--needle);
    opacity: 0;
    will-change: transform;
  }
  .line.target { background: var(--target); opacity: 1; top: 50%; }
  .value {
    margin-top: 8px;
    font-size: 1.05rem;
    font-variant-numeric: tabular-nums;
    height: 1.4em;
  }
  .value.dim { color: var(--ink-soft); }
  button {
    display: block;
    margin: 26px auto 0;
    padding: 12px 28px;
    font: inherit;
    color: var(--ink);
    background: var(--card);
    border: 2px solid var(--card-edge);
    border-radius: 999px;
    cursor: pointer;
    transition: background-color 0.2s;
  }
  button:hover { background: #efd5bf; }
</style>
</head>
<body>
<main>
  <img class="logo" src="icon-512.png" alt="" width="84" height="84">
  <h1>Uke Tuner</h1>
  <div class="status" id="status">Tap start, then allow the microphone</div>
  <div class="grid" id="grid"></div>
  <button id="toggle">Start listening</button>
</main>

<script>
(() => {
  // Standard GCEA tuning. Layout follows the mock-up.
  const STRINGS = [
    { name: "G", freq: 392.00 },
    { name: "C", freq: 261.63 },
    { name: "E", freq: 329.63 },
    { name: "A", freq: 440.00 },
  ];

  const RANGE_CENTS = 50;      // needle hits top/bottom of box at +/- this many cents
  const ENTER_CENTS = 4;       // turns green inside this
  const EXIT_CENTS = 8;        // stays green until outside this
  const ACCEPT_CENTS = 150;    // ignore pitches farther than this from any string
  const SILENCE_RMS = 0.012;   // below this, treat as no sound
  const HOLD_MS = 1500;        // keep last reading this long after a pluck fades

  const grid = document.getElementById("grid");
  const statusEl = document.getElementById("status");
  const btn = document.getElementById("toggle");

  // Build cards
  const cards = STRINGS.map(s => {
    const el = document.createElement("div");
    el.className = "card";
    el.innerHTML = `
      <div class="note">${s.name}<small>4</small></div>
      <div class="boxes">
        <div class="col">
          <div class="label">Now</div>
          <div class="box"><div class="mid"></div><div class="line now"></div></div>
          <div class="value dim now-val">---</div>
        </div>
        <div class="col">
          <div class="label">Target</div>
          <div class="box"><div class="mid"></div><div class="line target"></div></div>
          <div class="value target-val">${s.freq.toFixed(2)}</div>
        </div>
      </div>`;
    grid.appendChild(el);
    return {
      el,
      line: el.querySelector(".line.now"),
      val: el.querySelector(".now-val"),
      boxEl: el.querySelector(".box"),
      pos: 0,          // displayed needle position, in cents
      goal: 0,         // smoothed measured cents
      shown: null,     // smoothed measured Hz
      lastHeard: 0,
      intune: false,
    };
  });

  // ---------- Audio ----------
  let ctx = null, analyser = null, stream = null, buf = null, running = false, rafId = 0;

  async function start() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
      });
    } catch (e) {
      statusEl.textContent = "Microphone blocked. Allow access in your browser and try again.";
      return;
    }
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    const src = ctx.createMediaStreamSource(stream);
    analyser = ctx.createAnalyser();
    analyser.fftSize = 4096;
    buf = new Float32Array(analyser.fftSize);
    src.connect(analyser);
    running = true;
    btn.textContent = "Stop";
    statusEl.textContent = "Listening. Pluck a string.";
    loop();
  }

  function stop() {
    running = false;
    cancelAnimationFrame(rafId);
    if (stream) stream.getTracks().forEach(t => t.stop());
    if (ctx) ctx.close();
    btn.textContent = "Start listening";
    statusEl.textContent = "Stopped";
    cards.forEach(c => { c.lastHeard = 0; });
    draw();
  }

  btn.addEventListener("click", () => running ? stop() : start());

  // YIN-style pitch detection, limited to the ukulele range
  function detectPitch(data, sampleRate) {
    const n = data.length;
    let rms = 0;
    for (let i = 0; i < n; i++) rms += data[i] * data[i];
    rms = Math.sqrt(rms / n);
    if (rms < SILENCE_RMS) return null;

    const minTau = Math.floor(sampleRate / 520);
    const maxTau = Math.min(Math.floor(sampleRate / 200), (n >> 1) - 1);
    const w = n >> 1;
    const d = new Float32Array(maxTau + 1);

    for (let tau = minTau; tau <= maxTau; tau++) {
      let sum = 0;
      for (let i = 0; i < w; i++) {
        const diff = data[i] - data[i + tau];
        sum += diff * diff;
      }
      d[tau] = sum;
    }
    // cumulative mean normalised difference
    const cmnd = new Float32Array(maxTau + 1);
    let running = 0;
    for (let tau = 1; tau <= maxTau; tau++) {
      if (tau < minTau) { running += d[tau] || 0; continue; }
      running += d[tau];
      cmnd[tau] = d[tau] * tau / (running || 1);
    }
    // first dip under threshold, then walk to the local minimum
    const THRESH = 0.15;
    let best = -1;
    for (let tau = minTau; tau <= maxTau; tau++) {
      if (cmnd[tau] < THRESH) {
        while (tau + 1 <= maxTau && cmnd[tau + 1] < cmnd[tau]) tau++;
        best = tau;
        break;
      }
    }
    if (best < 0) return null;
    // parabolic interpolation
    const a = cmnd[best - 1] || cmnd[best], b = cmnd[best], c = cmnd[best + 1] || cmnd[best];
    const denom = a - 2 * b + c;
    const shift = denom !== 0 ? 0.5 * (a - c) / denom : 0;
    return sampleRate / (best + shift);
  }

  const centsBetween = (f, ref) => 1200 * Math.log2(f / ref);

  function loop() {
    if (!running) return;
    analyser.getFloatTimeDomainData(buf);
    const f = detectPitch(buf, ctx.sampleRate);
    const now = performance.now();

    if (f) {
      // nearest string by cents
      let idx = 0, bestAbs = Infinity;
      STRINGS.forEach((s, i) => {
        const a = Math.abs(centsBetween(f, s.freq));
        if (a < bestAbs) { bestAbs = a; idx = i; }
      });
      if (bestAbs <= ACCEPT_CENTS) {
        const c = cards[idx];
        const cents = centsBetween(f, STRINGS[idx].freq);
        // smooth readings
        c.shown = c.shown == null || now - c.lastHeard > 600 ? f : c.shown + (f - c.shown) * 0.35;
        c.goal = centsBetween(c.shown, STRINGS[idx].freq);
        c.lastHeard = now;
        // other strings go quiet
        cards.forEach((o, i) => { if (i !== idx) o.lastHeard = 0; });
      }
    }
    draw();
    rafId = requestAnimationFrame(loop);
  }

  // Render: runs on its own so needles glide even between detections
  function draw() {
    const now = performance.now();
    cards.forEach((c, i) => {
      const heard = c.lastHeard && now - c.lastHeard < HOLD_MS;
      c.el.classList.toggle("active", !!heard);

      if (heard) {
        c.pos += (c.goal - c.pos) * 0.18;           // smooth glide
        const clamped = Math.max(-RANGE_CENTS, Math.min(RANGE_CENTS, c.pos));
        const h = c.boxEl.clientHeight;
        const y = (-clamped / RANGE_CENTS) * (h / 2 - 8) + h / 2;
        c.line.style.opacity = "1";
        c.line.style.transform = `translateY(${y}px)`;
        c.val.textContent = c.shown.toFixed(1);
        c.val.classList.remove("dim");

        const abs = Math.abs(c.goal);
        if (!c.intune && abs <= ENTER_CENTS) c.intune = true;
        else if (c.intune && abs > EXIT_CENTS) c.intune = false;
      } else {
        c.intune = false;
        c.line.style.opacity = "0";
        c.val.textContent = "---";
        c.val.classList.add("dim");
        c.shown = null;
        c.pos = 0;
      }
      c.el.classList.toggle("intune", c.intune);
    });
    if (!running) return;
    // keep fading logic alive even if audio loop is paused
  }

  draw();
})();
</script>
</body>
</html>
